name: trovaya-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trovaya
      POSTGRES_USER: trovaya
      POSTGRES_PASSWORD: local-only-trovaya
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trovaya -d trovaya"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - ../services/event-indexer/migrations:/migrations:ro

  poison-engine:
    build:
      context: ../services/poison-engine
      dockerfile: Dockerfile
    environment:
      TROVAYA_ALLOWED_ORIGINS: http://localhost:3000
      TROVAYA_UVICORN_HOST: 0.0.0.0
      TROVAYA_UVICORN_PORT: 8000
      TROVAYA_UVICORN_WORKERS: 1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  indexer:
    build:
      context: ..
      dockerfile: services/event-indexer/Dockerfile
    environment:
      INDEXER_RPC_URL: ${INDEXER_RPC_URL:-http://host.docker.internal:8545}
      INDEXER_EXPECTED_CHAIN_ID: ${INDEXER_EXPECTED_CHAIN_ID:-31337}
      TROVAYA_IP_NFT_ADDRESS: ${TROVAYA_IP_NFT_ADDRESS:-0x0000000000000000000000000000000000000000}
      INDEXER_START_BLOCK: ${INDEXER_START_BLOCK:-0}
      INDEXER_CONFIRMATIONS: ${INDEXER_CONFIRMATIONS:-0}
      DATABASE_URL: postgres://trovaya:local-only-trovaya@postgres:5432/trovaya
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
