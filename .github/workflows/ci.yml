name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/poison-engine/pyproject.toml
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -e ".[dev]"
        working-directory: services/poison-engine
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
