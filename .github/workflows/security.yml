name: Security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level high
      - name: Install audited Python toolchain
        run: python -m pip install --upgrade "setuptools>=83,<84" pip-audit
      - name: Install Poison Engine
        run: python -m pip install -e ".[dev]"
        working-directory: services/poison-engine
      - run: python -m pip_audit --skip-editable

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Report unavailable dependency review
        if: vars.DEPENDENCY_REVIEW_ENABLED != 'true'
        run: |
          echo "::notice title=Dependency review unavailable::Enable Dependency Graph and GitHub Code Security/Advanced Security, then set repository variable DEPENDENCY_REVIEW_ENABLED=true. pnpm and Python production audits remain enforced."
          echo "### Dependency review" >> "$GITHUB_STEP_SUMMARY"
          echo "Native dependency review was not run because repository capability is not enabled." >> "$GITHUB_STEP_SUMMARY"
      - name: Review dependency changes
        if: vars.DEPENDENCY_REVIEW_ENABLED == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  solidity-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile contracts
        run: pnpm --filter @trovaya/contracts build
      - uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: packages/contracts
          # `ignore-compile` reuses the artifacts produced by the previous step, so
          # the action never installs Node inside its own container. crytic-compile
          # therefore logs that it could not start Hardhat and falls back to the
          # default Hardhat artifact path, which is the intended behaviour here.
          ignore-compile: true
          # `all` maps to `--fail-pedantic`, which fails the job on Informational
          # detectors as well (naming-convention, cyclomatic-complexity,
          # low-level-calls). Those style-only findings would keep this gate red
          # forever, so fail on Medium and above instead. Informational findings
          # remain visible in the job log.
          fail-on: medium
          # Vault access intentionally uses block time for bounded expiry/revocation.
          # Those paths are covered by contract tests; retain all other detectors.
          slither-args: --filter-paths "node_modules|contracts/mocks" --exclude timestamp

  deployment-roles:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @trovaya/contracts check:roles
        env:
          ROLE_CHECK_RPC_URL: ${{ secrets.ROLE_CHECK_RPC_URL }}
          TROVAYA_IP_NFT_ADDRESS: ${{ secrets.TROVAYA_IP_NFT_ADDRESS }}
          TROVAYA_VAULT_ADDRESS: ${{ secrets.TROVAYA_VAULT_ADDRESS }}
          EXPECTED_ADMIN_ADDRESS: ${{ secrets.EXPECTED_ADMIN_ADDRESS }}
          EXPECTED_PAUSER_ADDRESS: ${{ secrets.EXPECTED_PAUSER_ADDRESS }}
          EXPECTED_MINTER_ADDRESS: ${{ secrets.EXPECTED_MINTER_ADDRESS }}
          DEPLOYER_ADDRESS: ${{ secrets.DEPLOYER_ADDRESS }}
